flutter_native_splash:
  # Background color
  color: "#121212"

  # Image to display
  image: assets/images/logo.png

  # No branding image
  # branding: null

  # Text to display below the logo
  android_12:
    # The image parameter sets the splash screen icon image.
    image: assets/images/logo.png

    # No branding for Android 12
    # branding: null

    # The color_dark, background_image_dark, image_dark, branding_dark are parameters that set the background
    # and image when the device is in dark mode.
    color_dark: "#121212"
    image_dark: assets/images/logo.png
    # branding_dark: null

  # Platform specific customization
  web: false
  fullscreen: true
